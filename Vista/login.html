<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Acceso</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            background-color: #ffffff;
        }
        .brand-icon {
            font-size: 55px;
            color: rgb(228, 181, 120); 
        }
        .nav-pills .nav-link {
            color: #495057;
            border-radius: 30px;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #ffffff;
        }
    </style>
</head>

<body>
<form action="formlogin" action="" method="post">
<div class="card shadow-lg p-4 login-card">
        
        <div class="text-center mb-4">
           
            <i class="bi bi-shield-check brand-icon"></i>
            <h3 class="fw-bold mt-2 text-primary">CLUB ACERIAS</h3>
            <small class="text-muted">Gestión de Control y Acceso</small>
        </div>

       
        <div class="tab-content" id="pills-tabContent">
            
           
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
                <form action="Dahsboard.html" method="GET"> 
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="loginEmail" placeholder="ejemplo@acerias.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Recordarme</label>
                        </div>
                        <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar al Sistema</button>
                </form>
            </div>
        </div>
    </div>

</form>
    
    
    <script src="../bootstrap.bundle.min.js"></script>
</body>

<script src="../Controlador/login.js"></script>
</html>
