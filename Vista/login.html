<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-login {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border-top: 5px solid #3b82f6;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area i {
            font-size: 48px;
            color: #3b82f6;
        }

        .logo-area h2 {
            color: #1e293b;
            font-weight: 700;
            font-size: 1.5rem;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #64748b;
            font-size: 0.85rem;
            margin: 0;
        }

        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-primary-custom {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-primary-custom:hover {
            background-color: #1d4ed8;
            color: white;
        }

        .registro-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .registro-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .registro-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="contenedor-login">
        <div class="logo-area">
            <i class="bi bi-shield-lock"></i>
            <h2>CLUB ACERIAS</h2>
            <p>Gestión de Control y Acceso</p>
        </div>
        
        <form id="formLogin">
            <div class="grupo-input">
                <label for="email">Correo electrónico</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="contrasena">Contraseña</label>
                <input class="form-control" id="contrasena" name="Contraseña" type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary-custom">Ingresar al Sistema</button>

            <div class="registro-link">
                ¿No tienes una cuenta? <a href="Registro.html">Regístrate aquí</a>
            </div>

            <p id="mensajeLogin" class="mt-3 text-center fw-semibold text-danger small" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script src="../Controlador/login.js"></script>
</body>
</html>
