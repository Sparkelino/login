<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Acceso</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            background-color: #ffffff;
        }
        .brand-icon {
            font-size: 55px;
            color: rgb(228, 181, 120); 
        }
    </style>
</head>

<body>
    <div class="card shadow-lg p-4 login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check brand-icon"></i>
            <h3 class="fw-bold mt-2 text-primary">CLUB ACERIAS</h3>
            <small class="text-muted">Gestión de Control y Acceso</small>
        </div>

        <form id="formlogin">
            <div class="mb-3">
                <label for="usuario" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="usuario" placeholder="ejemplo@acerias.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="clave" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar al Sistema</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/login.js"></script>
</body>
</html>
