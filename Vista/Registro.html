<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ADSO - Registro</title>
    <link rel="stylesheet" href="../Assets/estilos.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Registro de Asociado - Acerías</h2>

        <form id="formRegistro" action="../Modelo/guardarAsociado.php" method="POST">
            <div class="grupo-input">
                <label for="documento">Documento de Identidad:</label>
                <input id="documento" name="documento" type="number" required placeholder="ejemplo: 1057000111">
            </div>
            
            <div class="grupo-input">
                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" name="nombres" required placeholder="Ingrese nombres completos">
            </div>

            <div class="grupo-input">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required placeholder="Ingrese apellidos completos">
            </div>

            <div class="grupo-input">
                <label for="fechaNacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="grupo-input">
                <label>Género:</label>
                <div class="opciones-genero">
                    <label>
                        <input type="radio" id="femenino" name="genero" value="Femenino" required>
                        <span>Femenino</span>
                    </label>
                    <label>
                        <input type="radio" id="masculino" name="genero" value="Masculino">
                        <span>Masculino</span>
                    </label>
                    <label>
                        <input type="radio" id="otro" name="genero" value="Otro">
                        <span>Otro</span>
                    </label>
                </div>
            </div>

            <div class="grupo-input">
                <label for="direccionResidencia">Dirección de residencia:</label>
                <input type="text" id="direccionResidencia" name="direccionResidencia" required placeholder="Ej: Calle 11 # 10-20">
            </div>

            <div class="grupo-input">
                <label for="ciudad">Ciudad:</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="">Seleccione una ciudad</option>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required placeholder="Ej: 3131110011">
            </div>

            <div class="grupo-input">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

            <p id="mensajeRegistro" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script src="../Controlador/Asociado.js"></script>
</body>
</html>
